name: Luxora tests

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: Africa/Cairo
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Website suite (full-business creates and modifies test data)
        type: choice
        default: login
        options:
          - login
          - business-partners
          - finance
          - manufacturing
          - internal-transfers
          - full-business

permissions:
  contents: read

jobs:
  unit:
    name: Offline unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Remove reports from older completed runs
        if: github.repository == 'Power-vision/automation_test' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const { data: current } = await github.rest.actions.getWorkflowRun({
              ...repo, run_id: context.runId
            });
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo, { ...repo, per_page: 100 }
            );
            const runs = new Map();
            let removed = 0;
            for (const artifact of artifacts) {
              if (!/^(unit-reports-|website-)/.test(artifact.name)) continue;
              const runId = artifact.workflow_run?.id;
              if (!runId || runId === context.runId) continue;
              if (!runs.has(runId)) {
                const { data } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: runId });
                runs.set(runId, data);
              }
              const run = runs.get(runId);
              if (run.workflow_id !== current.workflow_id || run.status !== 'completed') continue;
              if (Date.parse(run.created_at) >= Date.parse(current.created_at)) continue;
              try {
                await github.rest.actions.deleteArtifact({ ...repo, artifact_id: artifact.id });
                removed++;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            core.info(`Removed ${removed} old report artifacts; current and active runs preserved.`);
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run test:ci -- unit
      - name: Upload unit reports
        id: unit-report-upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            allure-report/
            allure-results/
            playwright-report/
            test-results/
      - name: Report unit artifact upload failure
        if: always() && steps.unit-report-upload.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Unit report upload failed. Test results remain in the job log; website tests can proceed if unit tests passed. Check Actions storage quota."
          echo "### Unit report unavailable" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact upload failed. Review the upload step and Actions storage quota. Unit test failures still fail this job." >> "$GITHUB_STEP_SUMMARY"

  website:
    name: Website tests
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: luxora-shared-test-data
      cancel-in-progress: false
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      LUXORA_EMAIL: ${{ secrets.LUXORA_EMAIL }}
      LUXORA_PASSWORD: ${{ secrets.LUXORA_PASSWORD }}
      LUXORA_SALES_REP: ${{ vars.LUXORA_SALES_REP }}
      SUITE: ${{ inputs.suite || 'full-business' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check test account configuration
        shell: bash
        run: |
          for key in BASE_URL LUXORA_EMAIL LUXORA_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing environment setting: $key"
              exit 1
            fi
          done
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run selected suite
        run: npm run test:ci -- "$SUITE"
      - name: Upload reports and evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-${{ env.SUITE }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            allure-report/
            allure-results/
            playwright-report/
            test-results/
